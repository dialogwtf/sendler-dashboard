[project]
name = "sendler-dash-indexer"
version = "0.1.0"
description = "Sendler Dash indexer: NEAR mainnet block stream -> MongoDB (trades, candles, launches, holders, smart money)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "motor>=3.7",
    "pymongo>=4.12",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
