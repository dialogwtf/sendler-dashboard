<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="description" content="Sendler Dash — launches, smart money, big moves and the NEAR network, live." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The first screen's data comes from the API: open the connection while the JS loads. -->
    <link rel="preconnect" href="https://api.sendler.xyz" crossorigin />
    <title>Sendler Dash</title>
    <!-- Link previews (Telegram, X): these are the site's card. On /token/<id> nginx serves this file
         through the API, which rewrites the title and these tags for the token (the web server proxies /token/<id> there,
         the API, /v2/dash/page/token/<id>) — keep the tags, the API finds them by name. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sendler Dash" />
    <meta property="og:title" content="Sendler Dash — NEAR memes, live" />
    <meta property="og:description" content="Launches, smart money, big moves and the NEAR network, live." />
    <meta property="og:url" content="https://dash.sendler.xyz/" />
    <meta property="og:image" content="https://dash.sendler.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sendler Dash: launches, smart money, big moves" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try { if (localStorage.getItem("dash:theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
    </script>
    <style>
      /* First paint before any JS or CSS arrives: the page colour and the logo, never a white flash. */
      html { background: #0B0E14; }
      html[data-theme="light"] { background: #F5F7FA; }
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0B0E14; transition: opacity .28s ease; }
      html[data-theme="light"] #splash { background: #F5F7FA; }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash path { stroke-dasharray: 44; animation: splash-pulse 1.4s ease-in-out infinite; }
      @keyframes splash-pulse { 0% { stroke-dashoffset: 44; } 55%, 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash path { animation: none; } #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#6F7FF0"/><path d="M6 17h5l3-7 4 13 3-6h5" fill="none" stroke="#0B0E14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
